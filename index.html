<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#131417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Service Log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Vehicle Service Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131417;
    --surface:#1c1e22;
    --surface-raised:#25282d;
    --border:#34373d;
    --border-soft:#2a2d32;
    --text:#eef0f1;
    --text-muted:#9a9ca1;
    --text-faint:#6a6d73;
    --accent:#e1231b;
    --accent-dim:#5c1512;
    --accent-glow:rgba(225,35,27,0.18);
    --amber:#f2a900;
    --green:#4c9a5a;
    --radius:10px;
    --radius-sm:6px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, #191b1f 0%, var(--bg) 55%) fixed,
      repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:100px;
  }
  ::selection{background:var(--accent-glow);}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Oswald',sans-serif; text-transform:uppercase;}

  .topbar{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(180deg, rgba(19,20,23,0.97) 0%, rgba(19,20,23,0.92) 80%, rgba(19,20,23,0) 100%);
    backdrop-filter:blur(6px);
    padding:18px 16px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border-soft);
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand-mark{
    width:34px; height:34px; border-radius:7px;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,0.06), 0 4px 14px var(--accent-glow);
    flex-shrink:0;
  }
  .brand-mark svg{width:19px; height:19px;}
  .brand-text{min-width:0;}
  .brand-text .t1{font-family:'Oswald',sans-serif; font-weight:700; font-size:16px; letter-spacing:0.04em; line-height:1.1;}
  .brand-text .t2{font-size:10px; letter-spacing:0.1em; color:var(--text-faint); text-transform:uppercase; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar-actions{display:flex; gap:8px; flex-shrink:0;}
  .icon-btn{
    width:38px; height:38px; border-radius:9px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); cursor:pointer; flex-shrink:0;
  }
  .icon-btn:active{background:var(--surface-raised);}
  .icon-btn svg{width:17px; height:17px;}

  .wrap{max-width:560px; margin:0 auto; padding:0 16px;}

  /* ---------- Vehicle chips ---------- */
  .chips-row{
    display:flex; gap:8px; overflow-x:auto; padding:14px 16px 2px;
    scrollbar-width:none;
  }
  .chips-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text-muted); padding:8px 14px; border-radius:20px;
    font-size:12.5px; font-weight:500; white-space:nowrap; cursor:pointer;
  }
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .chip.add-chip{background:transparent; border-style:dashed; color:var(--text-faint);}
  .chip svg{width:13px; height:13px;}

  /* ---------- Vehicle / warranty card ---------- */
  .veh-card{
    margin-top:10px;
    background:linear-gradient(160deg, var(--surface) 0%, #191b1e 100%);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:16px;
    position:relative;
    overflow:hidden;
  }
  .veh-card::before{
    content:"";
    position:absolute; top:-40%; right:-20%;
    width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    pointer-events:none;
  }
  .veh-name{font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; letter-spacing:0.01em;}
  .veh-sub{font-size:12px; color:var(--text-faint); margin-top:2px; letter-spacing:0.02em;}
  .veh-meta{display:flex; gap:18px; margin-top:14px; flex-wrap:wrap;}
  .veh-meta-item .label{font-size:9.5px; letter-spacing:0.12em; color:var(--text-faint); text-transform:uppercase;}
  .veh-meta-item .value{font-family:'JetBrains Mono',monospace; font-size:14px; margin-top:3px; color:var(--text);}
  .veh-links{display:flex; flex-wrap:wrap; gap:14px; margin-top:12px;}
  .veh-edit-link{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; color:var(--text-faint); cursor:pointer; letter-spacing:0.03em;
  }
  .veh-edit-link svg{width:11px; height:11px;}
  .veh-edit-link:active{color:var(--text-muted);}

  .gauges{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
  .gauge{background:var(--surface-raised); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:11px 12px;}
  .gauge-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;}
  .gauge-name{font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted);}
  .gauge-status{font-family:'JetBrains Mono',monospace; font-size:11px;}
  .gauge-status.ok{color:var(--green);}
  .gauge-status.warn{color:var(--amber);}
  .gauge-status.out{color:var(--accent);}
  .gauge-bar{height:6px; border-radius:4px; background:#14161a; overflow:hidden; border:1px solid var(--border-soft);}
  .gauge-fill{height:100%; border-radius:4px; transition:width .4s;}
  .gauge-detail{display:flex; justify-content:space-between; margin-top:6px; font-size:10.5px; color:var(--text-faint); font-family:'JetBrains Mono',monospace;}

  .disclaimer{font-size:10.5px; color:var(--text-faint); margin-top:14px; line-height:1.5; border-top:1px dashed var(--border-soft); padding-top:10px;}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px; padding:0 2px;}
  .section-title{font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-muted);}
  .section-count{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint);}

  .year-label{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--accent);
    letter-spacing:0.08em; margin:18px 2px 8px; display:flex; align-items:center; gap:8px;
  }
  .year-label::after{content:""; flex:1; height:1px; background:var(--border-soft);}

  .entry{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:13px 14px; margin-bottom:9px; cursor:pointer; position:relative;
  }
  .entry:active{background:var(--surface-raised);}
  .entry-row{display:flex; align-items:flex-start; gap:12px;}
  .entry-date-block{flex-shrink:0; width:46px; text-align:center; border-right:1px solid var(--border-soft); padding-right:12px;}
  .entry-date-block .day{font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; line-height:1;}
  .entry-date-block .mon{font-size:9.5px; letter-spacing:0.08em; color:var(--text-faint); text-transform:uppercase; margin-top:3px;}
  .entry-main{flex:1; min-width:0;}
  .entry-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .entry-type{font-family:'Oswald',sans-serif; font-weight:600; font-size:13.5px; letter-spacing:0.01em;}
  .entry-cost{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--text-muted); flex-shrink:0;}
  .entry-sub{display:flex; align-items:center; gap:10px; margin-top:4px; font-size:11.5px; color:var(--text-faint);}
  .entry-sub .mi{font-family:'JetBrains Mono',monospace; color:var(--text-muted);}
  .entry-photos-tag{display:flex; align-items:center; gap:3px;}
  .entry-photos-tag svg{width:11px; height:11px;}
  .entry-notes-preview{font-size:11.5px; color:var(--text-faint); margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .empty-state{text-align:center; padding:50px 20px 30px; color:var(--text-faint);}
  .empty-state svg{width:46px; height:46px; opacity:0.35; margin-bottom:14px;}
  .empty-state .t1{font-family:'Oswald',sans-serif; font-size:15px; color:var(--text-muted); letter-spacing:0.02em;}
  .empty-state .t2{font-size:12.5px; margin-top:6px; line-height:1.5;}
  .empty-state .btn{margin-top:16px; display:inline-block; padding:12px 22px;}

  .fab{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); max-width:560px; width:calc(100% - 32px); z-index:25;}
  .fab-btn{
    width:100%; background:var(--accent); color:#fff; border:none; padding:15px; border-radius:12px;
    font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; letter-spacing:0.06em; text-transform:uppercase;
    display:flex; align-items:center; justify-content:center; gap:9px;
    box-shadow:0 8px 24px rgba(225,35,27,0.35), 0 2px 6px rgba(0,0,0,0.3);
  }
  .fab-btn svg{width:17px; height:17px;}
  .fab-btn:active{background:#c31d16;}

  .overlay{position:fixed; inset:0; background:rgba(8,9,10,0.72); z-index:50; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px);}
  .overlay.open{display:flex;}
  .sheet{
    background:var(--bg); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
    border-radius:18px 18px 0 0; border:1px solid var(--border-soft); border-bottom:none;
    padding:6px 18px 24px; animation:slideUp .22s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; border-radius:3px; background:var(--border); margin:10px auto 14px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .sheet-title{font-family:'Oswald',sans-serif; font-weight:700; font-size:17px; letter-spacing:0.01em; text-transform:uppercase;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;}
  .field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm);
    padding:11px 12px; font-family:'Inter',sans-serif; font-size:14.5px; -webkit-appearance:none; appearance:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:70px; font-family:'Inter',sans-serif;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239a9ca1' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; background-size:14px; padding-right:34px !important;}

  .photo-input-btn{display:flex; align-items:center; justify-content:center; gap:8px; border:1.5px dashed var(--border); border-radius:var(--radius-sm); padding:16px; color:var(--text-muted); font-size:13px; cursor:pointer;}
  .photo-input-btn svg{width:18px; height:18px;}
  .photo-input-btn:active{border-color:var(--accent); color:var(--text);}
  .photo-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px;}
  .photo-thumb{position:relative; aspect-ratio:1; border-radius:7px; overflow:hidden; border:1px solid var(--border-soft);}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-thumb .rm{position:absolute; top:3px; right:3px; width:19px; height:19px; border-radius:50%; background:rgba(8,9,10,0.75); display:flex; align-items:center; justify-content:center;}
  .photo-thumb .rm svg{width:10px; height:10px; color:#fff;}
  .photo-loading{font-size:11px; color:var(--text-faint); margin-top:8px;}

  .sheet-actions{display:flex; gap:10px; margin-top:20px;}
  .btn{flex:1; padding:13px; border-radius:var(--radius-sm); border:none; font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:active{background:#c31d16;}
  .btn-ghost{background:var(--surface); color:var(--text-muted); border:1px solid var(--border);}
  .btn-ghost:active{background:var(--surface-raised);}
  .btn-danger-text{background:none; border:none; color:var(--accent); font-family:'Inter',sans-serif; font-size:12.5px; text-align:center; width:100%; padding:12px 0 2px; cursor:pointer; letter-spacing:0.02em;}

  .detail-photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0;}
  .detail-photo-grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid var(--border-soft);}
  .detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
  .detail-row:last-of-type{border-bottom:none;}
  .detail-row .k{color:var(--text-faint);}
  .detail-row .v{font-family:'JetBrains Mono',monospace; text-align:right;}
  .detail-notes{font-size:13.5px; color:var(--text-muted); line-height:1.55; margin-top:12px; background:var(--surface); border-radius:var(--radius-sm); padding:12px;}

  .lightbox{position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:70; display:none; align-items:center; justify-content:center; padding:20px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px;}
  .lightbox-close{position:absolute; top:20px; right:20px; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center;}
  .lightbox-close svg{width:16px; height:16px; color:#fff;}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--surface-raised); border:1px solid var(--border);
    color:var(--text); padding:11px 18px; border-radius:9px; font-size:13px; z-index:80; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; display:flex; align-items:center; gap:8px; max-width:calc(100% - 40px); text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
  .toast svg{width:14px; height:14px; color:var(--green); flex-shrink:0;}

  .setup-banner{
    background:linear-gradient(135deg, var(--accent-dim), #2a1210); border:1px solid #4a1c17; border-radius:var(--radius);
    padding:14px 16px; margin-top:14px; font-size:12.5px; color:#f0c9c6; line-height:1.5;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    </div>
    <div class="brand-text">
      <div class="t1">Service Log</div>
      <div class="t2" id="vehShortLabel">No vehicle yet</div>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="icon-btn" id="exportAllBtn" title="Export all vehicles" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="13" height="13" rx="2"/><path d="M21 8v11a2 2 0 0 1-2 2H8"/></svg>
    </div>
    <div class="icon-btn" id="exportBtn" title="Export CSV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </div>
  </div>
</div>

<div class="chips-row" id="chipsRow"></div>

<div class="wrap">

  <div id="vehCardWrap"></div>
  <div id="setupBannerWrap"></div>

  <div id="entriesSection" style="display:none;">
    <div class="section-head">
      <div class="section-title">Maintenance History</div>
      <div class="section-count" id="entryCount">0 entries</div>
    </div>
    <div id="entriesWrap"></div>
  </div>

</div>

<div class="fab" id="fabWrap" style="display:none;">
  <button class="fab-btn" id="addBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Log Service
  </button>
</div>

<!-- Add / Edit entry sheet -->
<div class="overlay" id="entryOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="entrySheetTitle">Log Service</div>
      <div class="icon-btn" id="closeEntrySheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>

    <div class="field-row">
      <div class="field"><label>Date</label><input type="date" id="fDate"></div>
      <div class="field"><label>Odometer (mi)</label><input type="number" id="fMileage" placeholder="e.g. 14200" inputmode="numeric"></div>
    </div>

    <div class="field">
      <label>Service Type</label>
      <select id="fType">
        <option>Oil Change</option>
        <option>Tire Rotation / Balance</option>
        <option>Multi-Point Inspection</option>
        <option>Brake Service</option>
        <option>Fluid Service</option>
        <option>Recall / TSB</option>
        <option>Warranty Repair</option>
        <option>Accessory Install</option>
        <option>Other</option>
      </select>
    </div>

    <div class="field-row">
      <div class="field"><label>Dealer / Shop</label><input type="text" id="fShop" placeholder="e.g. Toyota of..."></div>
      <div class="field"><label>Cost ($)</label><input type="number" id="fCost" placeholder="0.00" inputmode="decimal"></div>
    </div>

    <div class="field"><label>Notes</label><textarea id="fNotes" placeholder="Work performed, parts used, technician notes, warranty claim #..."></textarea></div>

    <div class="field">
      <label>Photos (receipts, invoices, work performed)</label>
      <label class="photo-input-btn" id="photoBtnLabel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Add photos
        <input type="file" id="fPhotos" accept="image/*" multiple capture="environment" style="display:none;">
      </label>
      <div class="photo-loading" id="photoLoading" style="display:none;">Compressing photos…</div>
      <div class="photo-grid" id="photoPreviewGrid"></div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelEntryBtn">Cancel</button>
      <button class="btn btn-primary" id="saveEntryBtn">Save Entry</button>
    </div>
    <button class="btn-danger-text" id="deleteEntryBtn" style="display:none;">Delete this entry</button>
  </div>
</div>

<!-- Vehicle add/edit sheet -->
<div class="overlay" id="vehOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="vehSheetTitle">Add Vehicle</div>
      <div class="icon-btn" id="closeVehSheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div class="field"><label>Nickname / Label</label><input type="text" id="vName" placeholder="e.g. 2024 Toyota Tundra TRD Pro"></div>
    <div class="field"><label>VIN</label><input type="text" id="vVin" placeholder="17-character VIN"></div>
    <div class="field-row">
      <div class="field"><label>Purchase Date</label><input type="date" id="vPurchaseDate"></div>
      <div class="field"><label>Current Mileage</label><input type="number" id="vMileage" inputmode="numeric"></div>
    </div>
    <div class="sheet-actions">

<script>
// ---------- Standalone on-device storage (IndexedDB) ----------
// Runs entirely on this device: no server, no account. If a host environment
// already provides window.storage (e.g. an embedded artifact), that is used
// instead and this shim steps aside.
(function(){
  "use strict";
  if(window.storage) return;
  const DB_NAME = 'vehicle-service-log';
  const STORE = 'kv';
  let dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=> req.result.createObjectStore(STORE);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return dbPromise;
  }
  async function idbGet(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = ()=> resolve(req.result !== undefined ? {key, value:req.result, shared:false} : null);
      req.onerror = ()=> reject(req.error);
    });
  }
  async function idbSet(key, value){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = ()=> resolve({key, value, shared:false});
      tx.onerror = ()=> reject(tx.error);
    });
  }
  async function idbDelete(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = ()=> resolve({key, deleted:true, shared:false});
      tx.onerror = ()=> reject(tx.error);
    });
  }
  window.storage = { get: idbGet, set: idbSet, delete: idbDelete };
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline caching unavailable, app still works online */ });
  });
}

(function(){
  "use strict";
  const $ = id => document.getElementById(id);

  let vehicles = [];          // [{id, name, vin, purchaseDate, mileage}]
  let activeVehicleId = null;
  let entries = [];           // entries for the active vehicle
  let currentPhotos = [];     // base64 array for entry being added/edited
  let editingId = null;       // entry id being edited, or null for new
  let editingVehicleId = null;// vehicle id being edited, or null for "add new"

  const getActiveVehicle = ()=> vehicles.find(v=>v.id===activeVehicleId) || null;

  // ---------- storage ----------
  async function migrateLegacySingleVehicle(){
    try{
      const v = await window.storage.get('vehicles');
      if(v && v.value) return false; // already on multi-vehicle storage
    }catch(e){}
    let oldVeh=null, oldEntries=[];
    try{ const r = await window.storage.get('vehicle-info'); if(r && r.value) oldVeh = JSON.parse(r.value); }catch(e){}
    try{ const r = await window.storage.get('entries'); if(r && r.value) oldEntries = JSON.parse(r.value); }catch(e){}
    if(oldVeh || oldEntries.length){
      const id = 'v-' + Date.now().toString(36);
      const veh = {
        id,
        name: (oldVeh && oldVeh.name) || '2024 Toyota Tundra TRD Pro',
        vin: (oldVeh && oldVeh.vin) || '',
        purchaseDate: (oldVeh && oldVeh.purchaseDate) || '',
        mileage: (oldVeh && oldVeh.mileage != null) ? oldVeh.mileage : null
      };
      vehicles = [veh];
      activeVehicleId = id;
      try{ await window.storage.set('vehicles', JSON.stringify(vehicles)); }catch(e){}
      try{ await window.storage.set('active-vehicle', id); }catch(e){}
      try{ await window.storage.set('entries:'+id, JSON.stringify(oldEntries)); }catch(e){}
      return true;
    }
    return false;
  }

  async function loadAll(){
    const migrated = await migrateLegacySingleVehicle();
    if(!migrated){
      try{
        const v = await window.storage.get('vehicles');
        vehicles = (v && v.value) ? JSON.parse(v.value) : [];
      }catch(e){ vehicles = []; }
      try{
        const a = await window.storage.get('active-vehicle');
        activeVehicleId = (a && a.value) ? a.value : (vehicles[0] ? vehicles[0].id : null);
      }catch(e){ activeVehicleId = vehicles[0] ? vehicles[0].id : null; }
    }
    await loadEntriesForActiveVehicle();
    renderChips();
    renderVehicleCard();
    renderEntries();
  }

  async function loadEntriesForActiveVehicle(){
    if(!activeVehicleId){ entries = []; return; }
    try{
      const e = await window.storage.get('entries:'+activeVehicleId);
      entries = (e && e.value) ? JSON.parse(e.value) : [];
    }catch(err){ entries = []; }
  }

  async function saveVehiclesList(){
    try{ await window.storage.set('vehicles', JSON.stringify(vehicles)); }
    catch(e){ showToast("Couldn't save vehicle list."); }
  }
  async function saveActiveVehicleId(){
    try{ await window.storage.set('active-vehicle', activeVehicleId); }catch(e){}
  }
  async function saveEntriesForActive(){
    try{ await window.storage.set('entries:'+activeVehicleId, JSON.stringify(entries)); }
    catch(e){ showToast("Couldn't save — storage may be full."); }
  }
  async function savePhotosForEntry(id, photos){
    try{
      const res = await window.storage.set('photos:'+id, JSON.stringify(photos));
      if(!res) throw new Error('failed');
      return true;
    }catch(e){ showToast("Photos too large to save — try fewer or smaller images."); return false; }
  }
  async function getPhotosForEntry(id){
    try{ const r = await window.storage.get('photos:'+id); return r && r.value ? JSON.parse(r.value) : []; }
    catch(e){ return []; }
  }
  async function deletePhotosForEntry(id){ try{ await window.storage.delete('photos:'+id); }catch(e){} }

  // ---------- toast ----------
  let toastTimer;
  function showToast(msg){
    $('toastMsg').textContent = msg;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> $('toast').classList.remove('show'), 2400);
  }

  function fmtDate(d){
    if(!d) return "—";
    const dt = new Date(d+"T00:00:00");
    return dt.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
  }
  function monthsBetween(d1,d2){
    return (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth()) + (d2.getDate()>=d1.getDate()?0:-1);
  }
  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s==null? '' : String(s);
    return d.innerHTML;
  }
  function shortLabel(name){
    return (name || 'Vehicle').replace(/^\d{4}\s+/,'');
  }

  // ---------- vehicle chips ----------
  function renderChips(){
    const wrap = $('chipsRow');
    let html = vehicles.map(v=>`
      <div class="chip ${v.id===activeVehicleId?'active':''}" data-id="${v.id}">${escapeHtml(shortLabel(v.name))}</div>
    `).join('');
    html += `<div class="chip add-chip" data-id="__add__">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add vehicle
    </div>`;
    wrap.innerHTML = html;
    wrap.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const id = chip.getAttribute('data-id');
        if(id === '__add__') openVehicleSheet(null);
        else switchVehicle(id);
      });
    });
  }

  async function switchVehicle(id){
    if(id === activeVehicleId) return;
    activeVehicleId = id;
    await saveActiveVehicleId();
    await loadEntriesForActiveVehicle();
    renderChips();
    renderVehicleCard();
    renderEntries();
  }

  // ---------- vehicle card + warranty gauges ----------
  function renderVehicleCard(){
    const wrap = $('vehCardWrap');
    const setupWrap = $('setupBannerWrap');
    const veh = getActiveVehicle();

    $('exportAllBtn').style.display = vehicles.length > 1 ? 'flex' : 'none';

    if(!veh){
      $('vehShortLabel').textContent = 'No vehicle yet';
      $('fabWrap').style.display = 'none';
      $('entriesSection').style.display = 'none';
      setupWrap.innerHTML = '';
      wrap.innerHTML = `<div class="empty-state" style="padding-top:20px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M5 17a2 2 0 0 1-2-2v-2l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v2a2 2 0 0 1-2 2M5 17v2a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-2m10 0v2a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-2"/></svg>
        <div class="t1">Add your first vehicle</div>
        <div class="t2">Track maintenance and warranty history<br>for as many vehicles as you own.</div>
        <button class="btn btn-primary" id="emptyAddVehBtn" style="margin-top:16px; width:auto; padding:12px 24px;">Add Vehicle</button>
      </div>`;
      $('emptyAddVehBtn').addEventListener('click', ()=> openVehicleSheet(null));
      return;
    }

    $('fabWrap').style.display = 'block';
    $('entriesSection').style.display = 'block';
    $('vehShortLabel').textContent = shortLabel(veh.name);

    if(!veh.purchaseDate){
      setupWrap.innerHTML = '<div class="setup-banner"><b>Set a purchase date</b> to track warranty coverage automatically. Tap "Edit vehicle & warranty info" below.</div>';
    } else {
      setupWrap.innerHTML = '';
    }

    let gaugesHtml = '';
    if(veh.purchaseDate){
      const today = new Date();
      const purchase = new Date(veh.purchaseDate+"T00:00:00");
      const monthsElapsed = Math.max(0, monthsBetween(purchase, today));
      const currentMiles = Number(veh.mileage) || 0;
      const plans = [
        {name:"Basic Coverage", months:36, miles:36000},
        {name:"Powertrain Coverage", months:60, miles:60000}
      ];
      gaugesHtml = plans.map(p=>{
        const timePct = Math.min(100, (monthsElapsed/p.months)*100);
        const milesPct = Math.min(100, (currentMiles/p.miles)*100);
        const usedPct = Math.max(timePct, milesPct);
        const remMonths = Math.max(0, p.months - monthsElapsed);
        const remMiles = Math.max(0, p.miles - currentMiles);
        let statusClass='ok', statusText='Active';
        if(usedPct>=100){ statusClass='out'; statusText='Expired'; }
        else if(usedPct>=85){ statusClass='warn'; statusText='Ending soon'; }
        const barColor = statusClass==='out' ? 'var(--accent)' : statusClass==='warn' ? 'var(--amber)' : 'var(--green)';
        return `<div class="gauge">
          <div class="gauge-top"><div class="gauge-name">${p.name}</div><div class="gauge-status ${statusClass}">${statusText}</div></div>
          <div class="gauge-bar"><div class="gauge-fill" style="width:${usedPct}%; background:${barColor};"></div></div>
          <div class="gauge-detail"><span>${remMonths} mo left</span><span>${remMiles.toLocaleString()} mi left</span></div>
        </div>`;
      }).join('');
    }

    wrap.innerHTML = `<div class="veh-card">
      <div class="veh-name">${escapeHtml(veh.name)}</div>
      <div class="veh-sub">${veh.vin ? "VIN " + escapeHtml(veh.vin) : "VIN not set"}</div>
      <div class="veh-meta">
        <div class="veh-meta-item"><div class="label">Purchased</div><div class="value">${veh.purchaseDate ? fmtDate(veh.purchaseDate) : "—"}</div></div>
        <div class="veh-meta-item"><div class="label">Current Miles</div><div class="value">${(veh.mileage!=null && veh.mileage!=="") ? Number(veh.mileage).toLocaleString()+" mi" : "—"}</div></div>
      </div>
      <div class="gauges">${gaugesHtml}</div>
      <div class="veh-links">
        <div class="veh-edit-link" id="editVehLink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit vehicle &amp; warranty info
        </div>
      </div>
      ${veh.purchaseDate ? '<div class="disclaimer">Warranty windows shown are Toyota&#39;s standard Basic (36mo/36k mi) and Powertrain (60mo/60k mi) terms as a reference estimate — confirm exact coverage in your warranty booklet, since terms vary by vehicle and region.</div>' : ''}
    </div>`;

    $('editVehLink').addEventListener('click', ()=> openVehicleSheet(veh.id));
  }

  // ---------- entries render ----------
  function renderEntries(){
    const wrap = $('entriesWrap');
    $('entryCount').textContent = entries.length + (entries.length===1 ? ' entry' : ' entries');

    if(entries.length===0){
      wrap.innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <div class="t1">No service logged yet</div>
        <div class="t2">Log your first oil change, inspection, or<br>warranty repair to start the record.</div>
      </div>`;
      return;
    }

    const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date));
    let html = '';
    let lastYear = null;
    const monthAbbr = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

    sorted.forEach(e=>{
      const dt = new Date(e.date+"T00:00:00");
      const year = dt.getFullYear();
      if(year !== lastYear){ html += `<div class="year-label">${year}</div>`; lastYear = year; }
      const costStr = (e.cost!=null && e.cost!=="") ? "$"+Number(e.cost).toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:2}) : "";
      const photosTag = e.photoCount>0 ? `<span class="entry-photos-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>${e.photoCount}</span>` : '';
      html += `<div class="entry" data-id="${e.id}">
        <div class="entry-row">
          <div class="entry-date-block"><div class="day">${dt.getDate()}</div><div class="mon">${monthAbbr[dt.getMonth()]}</div></div>
          <div class="entry-main">
            <div class="entry-top"><div class="entry-type">${escapeHtml(e.type)}</div><div class="entry-cost">${costStr}</div></div>
            <div class="entry-sub">
              <span class="mi">${Number(e.mileage).toLocaleString()} mi</span>
              ${e.shop ? '<span>'+escapeHtml(e.shop)+'</span>' : ''}
              ${photosTag}
            </div>
            ${e.notes ? `<div class="entry-notes-preview">${escapeHtml(e.notes)}</div>` : ''}
          </div>
        </div>
      </div>`;
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll('.entry').forEach(el=>{
      el.addEventListener('click', ()=> openDetail(el.getAttribute('data-id')));
    });
  }

  // ---------- image compression ----------
  function compressImage(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = function(ev){
        const img = new Image();
        img.onload = function(){
          const maxDim = 1100;
          let w = img.width, h = img.height;
          if(w > maxDim || h > maxDim){
            if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.62));
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderPhotoPreview(){
    $('photoPreviewGrid').innerHTML = currentPhotos.map((p,i)=>`
      <div class="photo-thumb"><img src="${p}"><div class="rm" data-idx="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div></div>`).join('');
    $('photoPreviewGrid').querySelectorAll('.rm').forEach(btn=>{
      btn.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        currentPhotos.splice(Number(btn.getAttribute('data-idx')),1);
        renderPhotoPreview();
      });
    });
  }

  $('fPhotos').addEventListener('change', async (ev)=>{
    const files = Array.from(ev.target.files || []);
    if(files.length===0) return;
    $('photoLoading').style.display = 'block';
    for(const f of files){
      try{ currentPhotos.push(await compressImage(f)); }catch(e){}
    }
    $('photoLoading').style.display = 'none';
    renderPhotoPreview();
    ev.target.value = '';
  });

  // ---------- entry sheet ----------
  function openEntrySheet(entry){
    editingId = entry ? entry.id : null;
    $('entrySheetTitle').textContent = entry ? 'Edit Service' : 'Log Service';
    $('deleteEntryBtn').style.display = entry ? 'block' : 'none';
    const veh = getActiveVehicle();

    if(entry){
      $('fDate').value = entry.date;
      $('fMileage').value = entry.mileage;
      $('fType').value = entry.type;
      $('fShop').value = entry.shop || '';
      $('fCost').value = entry.cost!=null ? entry.cost : '';
      $('fNotes').value = entry.notes || '';
      getPhotosForEntry(entry.id).then(p=>{ currentPhotos = p; renderPhotoPreview(); });
    } else {
      $('fDate').value = new Date().toISOString().slice(0,10);
      $('fMileage').value = (veh && veh.mileage) ? veh.mileage : '';
      $('fType').value = 'Oil Change';
      $('fShop').value = '';
      $('fCost').value = '';
      $('fNotes').value = '';
      currentPhotos = [];
      renderPhotoPreview();
    }
    $('entryOverlay').classList.add('open');
  }
  function closeEntrySheet(){
    $('entryOverlay').classList.remove('open');
    editingId = null;
    currentPhotos = [];
  }
  $('addBtn').addEventListener('click', ()=> openEntrySheet(null));
  $('closeEntrySheet').addEventListener('click', closeEntrySheet);
  $('cancelEntryBtn').addEventListener('click', closeEntrySheet);

  $('saveEntryBtn').addEventListener('click', async ()=>{
    if(!activeVehicleId) return;
    const date = $('fDate').value;
    const mileage = $('fMileage').value;
    const type = $('fType').value;
    if(!date || mileage===''){ showToast('Date and odometer are required.'); return; }

    const id = editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2,7));
    const entryData = {
      id, date, mileage:Number(mileage), type,
      shop: $('fShop').value.trim(),
      cost: $('fCost').value === '' ? null : Number($('fCost').value),
      notes: $('fNotes').value.trim(),
      photoCount: currentPhotos.length
    };

    const idx = entries.findIndex(e=>e.id===id);
    if(idx>=0) entries[idx] = entryData; else entries.push(entryData);

    await saveEntriesForActive();
    if(currentPhotos.length>0) await savePhotosForEntry(id, currentPhotos);
    else await deletePhotosForEntry(id);

    const veh = getActiveVehicle();
    if(veh && (!veh.mileage || Number(mileage) > Number(veh.mileage))){
      veh.mileage = Number(mileage);
      await saveVehiclesList();
      renderVehicleCard();
    }

    renderEntries();
    closeEntrySheet();
    showToast('Service saved to your log.');
  });

  $('deleteEntryBtn').addEventListener('click', async ()=>{
    if(!editingId) return;
    entries = entries.filter(e=>e.id!==editingId);
    await saveEntriesForActive();
    await deletePhotosForEntry(editingId);
    renderEntries();
    closeEntrySheet();
    showToast('Entry deleted.');
  });

  // ---------- vehicle add/edit sheet ----------
  function openVehicleSheet(vehicleId){
    editingVehicleId = vehicleId;
    const isEdit = !!vehicleId;
    $('vehSheetTitle').textContent = isEdit ? 'Edit Vehicle' : 'Add Vehicle';
    $('deleteVehBtn').style.display = isEdit ? 'block' : 'none';
    if(isEdit){
      const v = vehicles.find(x=>x.id===vehicleId);
      $('vName').value = v.name || '';
      $('vVin').value = v.vin || '';
      $('vPurchaseDate').value = v.purchaseDate || '';
      $('vMileage').value = v.mileage!=null ? v.mileage : '';
    } else {
      $('vName').value = '';
      $('vVin').value = '';
      $('vPurchaseDate').value = '';
      $('vMileage').value = '';
    }
    $('vehOverlay').classList.add('open');
  }
  function closeVehicleSheet(){ $('vehOverlay').classList.remove('open'); editingVehicleId = null; }
  $('closeVehSheet').addEventListener('click', closeVehicleSheet);
  $('cancelVehBtn').addEventListener('click', closeVehicleSheet);

  $('saveVehBtn').addEventListener('click', async ()=>{
    const name = $('vName').value.trim() || 'Unnamed Vehicle';
    const vin = $('vVin').value.trim();
    const purchaseDate = $('vPurchaseDate').value;
    const mileage = $('vMileage').value === '' ? null : Number($('vMileage').value);

    if(editingVehicleId){
      const v = vehicles.find(x=>x.id===editingVehicleId);
      v.name = name; v.vin = vin; v.purchaseDate = purchaseDate; v.mileage = mileage;
      await saveVehiclesList();
      renderChips();
      renderVehicleCard();
    } else {
      const id = 'v-' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
      vehicles.push({ id, name, vin, purchaseDate, mileage });
      await saveVehiclesList();
      activeVehicleId = id;
      await saveActiveVehicleId();
      await loadEntriesForActiveVehicle();
      renderChips();
      renderVehicleCard();
      renderEntries();
    }
    closeVehicleSheet();
    showToast(editingVehicleId ? 'Vehicle updated.' : 'Vehicle added.');
  });

  $('deleteVehBtn').addEventListener('click', async ()=>{
    if(!editingVehicleId) return;
    const id = editingVehicleId;
    let delEntries = [];
    try{
      const e = await window.storage.get('entries:'+id);
      delEntries = (e && e.value) ? JSON.parse(e.value) : [];
    }catch(err){}
    for(const en of delEntries){ await deletePhotosForEntry(en.id); }
    try{ await window.storage.delete('entries:'+id); }catch(err){}

    vehicles = vehicles.filter(v=>v.id!==id);
    await saveVehiclesList();

    if(activeVehicleId === id){
      activeVehicleId = vehicles[0] ? vehicles[0].id : null;
      await saveActiveVehicleId();
      await loadEntriesForActiveVehicle();
    }
    renderChips();
    renderVehicleCard();
    renderEntries();
    closeVehicleSheet();
    showToast('Vehicle deleted.');
  });

  // ---------- detail sheet ----------
  async function openDetail(id){
    const e = entries.find(x=>x.id===id);
    if(!e) return;
    $('detailTitle').textContent = e.type;
    const photos = await getPhotosForEntry(id);
    const costStr = (e.cost!=null) ? "$"+Number(e.cost).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : "—";
    $('detailBody').innerHTML = `
      <div class="detail-row"><div class="k">Date</div><div class="v">${fmtDate(e.date)}</div></div>
      <div class="detail-row"><div class="k">Odometer</div><div class="v">${Number(e.mileage).toLocaleString()} mi</div></div>
      <div class="detail-row"><div class="k">Dealer / Shop</div><div class="v">${e.shop ? escapeHtml(e.shop) : "—"}</div></div>
      <div class="detail-row"><div class="k">Cost</div><div class="v">${costStr}</div></div>
      ${e.notes ? `<div class="detail-notes">${escapeHtml(e.notes)}</div>` : ''}
      ${photos.length>0 ? `<div class="detail-photo-grid">${photos.map(p=>`<img src="${p}" class="detail-photo-img">`).join('')}</div>` : ''}
    `;
    $('detailBody').querySelectorAll('.detail-photo-img').forEach(img=>{
      img.addEventListener('click', ()=>{ $('lightboxImg').src = img.src; $('lightbox').classList.add('open'); });
    });
    $('detailOverlay').classList.add('open');
    $('detailEditBtn').onclick = ()=>{ $('detailOverlay').classList.remove('open'); openEntrySheet(e); };
  }
  $('closeDetailSheet').addEventListener('click', ()=> $('detailOverlay').classList.remove('open'));
  $('detailCloseBtn').addEventListener('click', ()=> $('detailOverlay').classList.remove('open'));
  $('lightboxClose').addEventListener('click', ()=> $('lightbox').classList.remove('open'));
  $('lightbox').addEventListener('click', (ev)=>{ if(ev.target.id==='lightbox') $('lightbox').classList.remove('open'); });

  // ---------- CSV export ----------
  function csvEscape(v){
    if(v==null) return '';
    const s = String(v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function downloadCsv(filename, csv){
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  $('exportBtn').addEventListener('click', ()=>{
    const veh = getActiveVehicle();
    if(!veh){ showToast('Add a vehicle first.'); return; }
    if(entries.length===0){ showToast('No entries to export yet.'); return; }
    const header = ['Date','Odometer (mi)','Service Type','Dealer/Shop','Cost ($)','Notes','Photo Count'];
    const rows = [...entries].sort((a,b)=> a.date.localeCompare(b.date)).map(e=>[
      e.date, e.mileage, e.type, e.shop||'', e.cost!=null?e.cost:'', e.notes||'', e.photoCount||0
    ]);
    let csv = header.map(csvEscape).join(',') + '\n';
    rows.forEach(r=>{ csv += r.map(csvEscape).join(',') + '\n'; });
    const vinPart = veh.vin ? '-'+veh.vin.slice(-6) : '';
    downloadCsv(`service-log-${shortLabel(veh.name).replace(/\s+/g,'-').toLowerCase()}${vinPart}-${new Date().toISOString().slice(0,10)}.csv`, csv);
    showToast('CSV downloaded.');
  });

  $('exportAllBtn').addEventListener('click', async ()=>{
    if(vehicles.length===0){ showToast('Add a vehicle first.'); return; }
    const header = ['Vehicle','VIN','Date','Odometer (mi)','Service Type','Dealer/Shop','Cost ($)','Notes','Photo Count'];
    let allRows = [];
    for(const v of vehicles){
      let vEntries = [];
      try{
        const e = await window.storage.get('entries:'+v.id);
        vEntries = (e && e.value) ? JSON.parse(e.value) : [];
      }catch(err){}
      vEntries.sort((a,b)=> a.date.localeCompare(b.date)).forEach(e=>{
        allRows.push([v.name, v.vin||'', e.date, e.mileage, e.type, e.shop||'', e.cost!=null?e.cost:'', e.notes||'', e.photoCount||0]);
      });
    }
    if(allRows.length===0){ showToast('No entries to export yet.'); return; }
    let csv = header.map(csvEscape).join(',') + '\n';
    allRows.forEach(r=>{ csv += r.map(csvEscape).join(',') + '\n'; });
    downloadCsv(`all-vehicles-service-log-${new Date().toISOString().slice(0,10)}.csv`, csv);
    showToast('Combined CSV downloaded.');
  });

  loadAll();
})();
</script>
</body>
</html>
